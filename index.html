<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AnimusGame</title>
<style>
:root{--bg:#f5f8f6;--fg:#1d2a26;--muted:#5b6b66;--line:#d6e0dc;--accent:#2f8a68;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a17;--fg:#e4eeea;--muted:#9fb2ab;--line:#24352f;--accent:#5fd0a2;--card:#15241f;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 "Segoe UI",Arial,sans-serif;padding:48px max(16px,env(safe-area-inset-left)) 64px}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1{margin:0;font-size:32px}p{margin:0;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:6px}
.card h2{margin:0;font-size:20px}a{color:var(--accent);font-weight:700}
</style>
</head>
<body>
<main>
<header><h1>AnimusGame</h1><p>Small casual games about evolution.</p></header>
<section class="card"><h2>Evolution Tubes</h2><p>Sort creatures into tubes of water, land and air and grow them from a microbe to a dragon.</p><a href="https://play.google.com/store/apps/details?id=com.animusgame.evolutiontubes">Google Play</a></section>
<section class="card"><h2>Evo Drop</h2><p>Drop and merge creatures to climb the evolution ladder.</p></section>
<p><a href="privacy.html">Privacy Policy</a></p>
</main>
</body>
</html>
